[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openwebui-assistant-core"
version = "0.1.0"
description = "Core package for a personal Open WebUI assistant."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
    "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
    "opentelemetry-instrumentation-httpx>=0.50b0,<1",
    "opentelemetry-sdk>=1.29,<2",
    "pgvector>=0.4,<1",
    "prometheus-client>=0.21,<1",
    "pydantic-settings>=2.6,<3",
    "pyjwt>=2.8,<3",
    "python-docx>=1.1,<2",
    "python-pptx>=1.0,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=25.1,<26",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/assistant_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["assistant_core"]

[[tool.mypy.overrides]]
module = [
    "openpyxl.*",
    "docx.*",
    "pptx.*",
]
ignore_missing_imports = true
disallow_untyped_calls = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "assistant_core.artifacts.generators.*",
]
disallow_untyped_calls = false
