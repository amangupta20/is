services:
  assistant-migrate:
    image: ${ASSISTANT_IMAGE:-assistant-core:local}
    build:
      context: ../assistant-core
      dockerfile: Dockerfile
    pull_policy: build
    environment:
      ASSISTANT_ENVIRONMENT: ${ASSISTANT_ENVIRONMENT:?set ASSISTANT_ENVIRONMENT}
      ASSISTANT_DATABASE_URL: ${ASSISTANT_DATABASE_URL:?set ASSISTANT_DATABASE_URL}
      ASSISTANT_HMAC_SECRET: ${ASSISTANT_HMAC_SECRET:?set ASSISTANT_HMAC_SECRET}
      ASSISTANT_REQUEST_CLOCK_SKEW_SECONDS: ${ASSISTANT_REQUEST_CLOCK_SKEW_SECONDS:?set ASSISTANT_REQUEST_CLOCK_SKEW_SECONDS}
      ASSISTANT_CONTEXT_TIMEOUT_SECONDS: ${ASSISTANT_CONTEXT_TIMEOUT_SECONDS:?set ASSISTANT_CONTEXT_TIMEOUT_SECONDS}
      ASSISTANT_LOG_LEVEL: ${ASSISTANT_LOG_LEVEL:?set ASSISTANT_LOG_LEVEL}
      ASSISTANT_OTLP_ENDPOINT: ${ASSISTANT_OTLP_ENDPOINT:-}
    command: alembic upgrade head
    restart: "no"
    init: true
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - assistant-private

  assistant-core:
    image: ${ASSISTANT_IMAGE:-assistant-core:local}
    environment:
      ASSISTANT_ENVIRONMENT: ${ASSISTANT_ENVIRONMENT:?set ASSISTANT_ENVIRONMENT}
      ASSISTANT_DATABASE_URL: ${ASSISTANT_DATABASE_URL:?set ASSISTANT_DATABASE_URL}
      ASSISTANT_HMAC_SECRET: ${ASSISTANT_HMAC_SECRET:?set ASSISTANT_HMAC_SECRET}
      ASSISTANT_ADMIN_TOKEN: ${ASSISTANT_ADMIN_TOKEN:-}
      ASSISTANT_REQUEST_CLOCK_SKEW_SECONDS: ${ASSISTANT_REQUEST_CLOCK_SKEW_SECONDS:?set ASSISTANT_REQUEST_CLOCK_SKEW_SECONDS}
      ASSISTANT_CONTEXT_TIMEOUT_SECONDS: ${ASSISTANT_CONTEXT_TIMEOUT_SECONDS:?set ASSISTANT_CONTEXT_TIMEOUT_SECONDS}
      ASSISTANT_OPEN_WEBUI_URL: ${ASSISTANT_OPEN_WEBUI_URL:-http://open-webui:8080}
      ASSISTANT_OPEN_WEBUI_API_KEY: ${ASSISTANT_OPEN_WEBUI_API_KEY:-}
      ASSISTANT_OIKB_URL: ${ASSISTANT_OIKB_URL:-http://oikb:8080}
      ASSISTANT_OIKB_API_KEY: ${ASSISTANT_OIKB_API_KEY:-}
      ASSISTANT_FILE_INDEXING_TIMEOUT_SECONDS: ${ASSISTANT_FILE_INDEXING_TIMEOUT_SECONDS:-30}
      ASSISTANT_EMBEDDING_BASE_URL: ${ASSISTANT_EMBEDDING_BASE_URL:-}
      ASSISTANT_EMBEDDING_API_KEY: ${ASSISTANT_EMBEDDING_API_KEY:-}
      ASSISTANT_EMBEDDING_MODEL: ${ASSISTANT_EMBEDDING_MODEL:-}
      ASSISTANT_EMBEDDING_DIMENSION: ${ASSISTANT_EMBEDDING_DIMENSION:-1536}
      ASSISTANT_EMBEDDING_TIMEOUT_SECONDS: ${ASSISTANT_EMBEDDING_TIMEOUT_SECONDS:-15}
      ASSISTANT_TASK_MODEL_BASE_URL: ${ASSISTANT_TASK_MODEL_BASE_URL:-}
      ASSISTANT_TASK_MODEL_API_KEY: ${ASSISTANT_TASK_MODEL_API_KEY:-}
      ASSISTANT_TASK_MODEL_MODEL: ${ASSISTANT_TASK_MODEL_MODEL:-}
      ASSISTANT_TASK_MODEL_TIMEOUT_SECONDS: ${ASSISTANT_TASK_MODEL_TIMEOUT_SECONDS:-15}
      ASSISTANT_GEMINI_API_KEY: ${ASSISTANT_GEMINI_API_KEY:-}
      ASSISTANT_GEMINI_MODEL: ${ASSISTANT_GEMINI_MODEL:-gemini-2.5-flash}
      ASSISTANT_GEMINI_TIMEOUT_SECONDS: ${ASSISTANT_GEMINI_TIMEOUT_SECONDS:-300}
      ASSISTANT_LOG_LEVEL: ${ASSISTANT_LOG_LEVEL:?set ASSISTANT_LOG_LEVEL}
      ASSISTANT_OTLP_ENDPOINT: ${ASSISTANT_OTLP_ENDPOINT:-}
    command:
      - uvicorn
      - assistant_core.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --no-access-log
    depends_on:
      assistant-migrate:
        condition: service_completed_successfully
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - assistant-private

  assistant-worker:
    image: ${ASSISTANT_IMAGE:-assistant-core:local}
    environment:
      ASSISTANT_ENVIRONMENT: ${ASSISTANT_ENVIRONMENT:?set ASSISTANT_ENVIRONMENT}
      ASSISTANT_DATABASE_URL: ${ASSISTANT_DATABASE_URL:?set ASSISTANT_DATABASE_URL}
      ASSISTANT_HMAC_SECRET: ${ASSISTANT_HMAC_SECRET:?set ASSISTANT_HMAC_SECRET}
      ASSISTANT_REQUEST_CLOCK_SKEW_SECONDS: ${ASSISTANT_REQUEST_CLOCK_SKEW_SECONDS:?set ASSISTANT_REQUEST_CLOCK_SKEW_SECONDS}
      ASSISTANT_CONTEXT_TIMEOUT_SECONDS: ${ASSISTANT_CONTEXT_TIMEOUT_SECONDS:?set ASSISTANT_CONTEXT_TIMEOUT_SECONDS}
      ASSISTANT_OPEN_WEBUI_URL: ${ASSISTANT_OPEN_WEBUI_URL:-http://open-webui:8080}
      ASSISTANT_OPEN_WEBUI_API_KEY: ${ASSISTANT_OPEN_WEBUI_API_KEY:-}
      ASSISTANT_OIKB_URL: ${ASSISTANT_OIKB_URL:-http://oikb:8080}
      ASSISTANT_OIKB_API_KEY: ${ASSISTANT_OIKB_API_KEY:-}
      ASSISTANT_FILE_INDEXING_TIMEOUT_SECONDS: ${ASSISTANT_FILE_INDEXING_TIMEOUT_SECONDS:-30}
      ASSISTANT_TASK_MODEL_BASE_URL: ${ASSISTANT_TASK_MODEL_BASE_URL:-}
      ASSISTANT_TASK_MODEL_API_KEY: ${ASSISTANT_TASK_MODEL_API_KEY:-}
      ASSISTANT_TASK_MODEL_MODEL: ${ASSISTANT_TASK_MODEL_MODEL:-}
      ASSISTANT_TASK_MODEL_TIMEOUT_SECONDS: ${ASSISTANT_TASK_MODEL_TIMEOUT_SECONDS:-15}
      ASSISTANT_GEMINI_API_KEY: ${ASSISTANT_GEMINI_API_KEY:-}
      ASSISTANT_GEMINI_MODEL: ${ASSISTANT_GEMINI_MODEL:-gemini-2.5-flash}
      ASSISTANT_GEMINI_TIMEOUT_SECONDS: ${ASSISTANT_GEMINI_TIMEOUT_SECONDS:-300}
      ASSISTANT_EMBEDDING_BASE_URL: ${ASSISTANT_EMBEDDING_BASE_URL:-}
      ASSISTANT_EMBEDDING_API_KEY: ${ASSISTANT_EMBEDDING_API_KEY:-}
      ASSISTANT_EMBEDDING_MODEL: ${ASSISTANT_EMBEDDING_MODEL:-}
      ASSISTANT_EMBEDDING_DIMENSION: ${ASSISTANT_EMBEDDING_DIMENSION:-1536}
      ASSISTANT_EMBEDDING_TIMEOUT_SECONDS: ${ASSISTANT_EMBEDDING_TIMEOUT_SECONDS:-15}
      ASSISTANT_LOG_LEVEL: ${ASSISTANT_LOG_LEVEL:?set ASSISTANT_LOG_LEVEL}
      ASSISTANT_OTLP_ENDPOINT: ${ASSISTANT_OTLP_ENDPOINT:-}
    command: python -m assistant_core.jobs.worker
    depends_on:
      assistant-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - assistant-private

networks:
  assistant-private:
    external: true
    name: ${ASSISTANT_NETWORK:?set ASSISTANT_NETWORK}
