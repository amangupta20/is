services:
  assistant-migrate:
    image: ${ASSISTANT_IMAGE:?set ASSISTANT_IMAGE}
    env_file:
      - .env.assistant
    command: alembic upgrade head
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - assistant-private

  assistant-core:
    image: ${ASSISTANT_IMAGE:?set ASSISTANT_IMAGE}
    env_file:
      - .env.assistant
    command:
      - uvicorn
      - assistant_core.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --no-access-log
    depends_on:
      assistant-migrate:
        condition: service_completed_successfully
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - assistant-private

  assistant-worker:
    image: ${ASSISTANT_IMAGE:?set ASSISTANT_IMAGE}
    env_file:
      - .env.assistant
    command: python -m assistant_core.jobs.worker
    depends_on:
      assistant-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - assistant-private

networks:
  assistant-private:
    external: true
    name: ${ASSISTANT_NETWORK:?set ASSISTANT_NETWORK}
