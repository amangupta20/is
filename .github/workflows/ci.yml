name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  assistant-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assistant-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run adapter plugin tests
        run: >
          uv run --project assistant-core
          --with httpx --with pydantic --with starlette --with anyio --with pytest
          pytest adapters/openwebui/tests -q
